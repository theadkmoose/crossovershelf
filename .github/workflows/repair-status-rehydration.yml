name: Repair status rehydration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix status UI normalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''  const store = window.CrossoverShelfReadingStore;\n  const currentStatus = store?.get ? (store.get(b.id)?.status || readingStatus[b.id] || "unread") : (readingStatus[b.id] || "unread");\n  readingStatus[b.id] = currentStatus;'''
          new = '''  const store = window.CrossoverShelfReadingStore;\n  const toUiStatus = status => status === "want-to-read" ? "want" : (status || "unread");\n  const currentStatus = store?.get ? toUiStatus(store.get(b.id)?.status || readingStatus[b.id] || "unread") : (readingStatus[b.id] || "unread");\n  readingStatus[b.id] = currentStatus;'''
          assert old in s
          s = s.replace(old, new, 1)
          old2 = '''        const record = store.setStatus(b.id, nextStatus, {title:b.title, author:b.author});\n        readingStatus[b.id] = record?.status || nextStatus;'''
          new2 = '''        const record = store.setStatus(b.id, nextStatus, {title:b.title, author:b.author});\n        readingStatus[b.id] = toUiStatus(record?.status || nextStatus);'''
          assert old2 in s
          p.write_text(s.replace(old2, new2, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix book status selection rehydration" || exit 0
          git push
