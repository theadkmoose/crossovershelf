name: One-time AI loader fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add direct AI module loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="./ai-recommendations.js?v=20260815" defer></script>'
          if marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(needle, marker + '\n' + needle, 1)
              p.write_text(text, encoding='utf-8')
              print('AI loader inserted.')
          else:
              print('AI loader already present.')
          PY

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load AI recommendations directly from index.html [skip ci]'
          git push

      - name: Remove this one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/one-time-ai-loader-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time AI loader workflow [skip ci]'
          git push