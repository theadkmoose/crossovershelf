name: Repair book reading status

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Repair book reading status') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index and add Currently Reading
        run: |
          git checkout a0ea828f22270626bb4ad1f988c19a2dca9545cb -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<button class="status-btn" data-status="want">Want to read</button>\n          <button class="status-btn" data-status="read">Read</button>'
          new='<button class="status-btn" data-status="want">Want to read</button>\n          <button class="status-btn" data-status="currently-reading">Currently reading</button>\n          <button class="status-btn" data-status="read">Read</button>'
          if old not in s: raise SystemExit('status button block not found')
          s=s.replace(old,new,1)
          old_label='const stLabel = st==="read"?"✓ Read":st==="want"?"📖 Want to read":"— Unread";'
          new_label='const stLabel = st==="read"?"✓ Read":st==="currently-reading"?"◉ Currently reading":st==="want"?"📖 Want to read":"— Unread";'
          if old_label not in s: raise SystemExit('card status label not found')
          s=s.replace(old_label,new_label,1)
          old_handler='''  document.querySelectorAll(".status-btn").forEach(btn=>{\n    btn.classList.toggle("active", (readingStatus[b.id]||"unread")===btn.dataset.status);\n    btn.onclick = ()=>{\n      readingStatus[b.id] = btn.dataset.status;\n      localStorage.setItem(STATUS_KEY, JSON.stringify(readingStatus));\n      document.querySelectorAll(".status-btn").forEach(x=>x.classList.toggle("active", x===btn));\n      document.getElementById("m-finished-row").style.display = btn.dataset.status==="read" ? "" : "none";\n      render();\n    };\n  });'''
          new_handler='''  const store = window.CrossoverShelfReadingStore;\n  const currentStatus = store?.get ? (store.get(b.id)?.status || readingStatus[b.id] || "unread") : (readingStatus[b.id] || "unread");\n  readingStatus[b.id] = currentStatus;\n  document.querySelectorAll(".status-btn").forEach(btn=>{\n    btn.classList.toggle("active", currentStatus===btn.dataset.status);\n    btn.onclick = ()=>{\n      const nextStatus = btn.dataset.status;\n      if(store?.setStatus){\n        const record = store.setStatus(b.id, nextStatus, {title:b.title, author:b.author});\n        readingStatus[b.id] = record?.status || nextStatus;\n      } else {\n        readingStatus[b.id] = nextStatus;\n        localStorage.setItem(STATUS_KEY, JSON.stringify(readingStatus));\n      }\n      document.querySelectorAll(".status-btn").forEach(x=>x.classList.toggle("active", x.dataset.status===nextStatus));\n      document.getElementById("m-finished-row").style.display = nextStatus==="read" ? "" : "none";\n      render();\n    };\n  });'''
          if old_handler not in s: raise SystemExit('status handler not found')
          s=s.replace(old_handler,new_handler,1)
          s=s.replace('finishedRow.style.display = (readingStatus[b.id]||"unread")==="read" ? "" : "none";','finishedRow.style.display = currentStatus==="read" ? "" : "none";',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair book reading status: add Currently Reading'
          git push
